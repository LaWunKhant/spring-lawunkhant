<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Detail</title>
    <style>
        .profile { border: 1px solid #ccc; padding: 20px; width: 300px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Employee Profile Detail</h2>
    
    <div th:if="${employee != null}" class.th="profile">
        <p><strong>ID:</strong> <span th:text="${employee.id}"></span></p>
        <p><strong>Code:</strong> <span th:text="${employee.code}"></span></p>
        <p><strong>Name:</strong> <span th:text="${employee.name}"></span></p>
        <p><strong>Age:</strong> <span th:text="${employee.age}"></span>歳</p>
    </div>
    
    <div th:if="${employee == null}">
        <p style="color: red;">Error: Employee not found!</p>
    </div>
    
    <a href="/emp/find">Back to List</a>
</body>
</html>
