<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Data</title>
    <style>
        table { border-collapse: collapse; width: 50%; margin: 20px 0; }
        th, td { border: 1px solid #dddddd; text-align: left; padding: 8px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
	
	<div>
    	<h2>All Employee Information</h2>
    </div>
    
    <div>
	    <table>
	        <thead>
	            <tr>
	                <th>ID</th>
	                <th>Code</th>
	                <th>Name</th>
	                <th>Age</th>
	                <th>Action</th>
	            </tr>
	        </thead>
	        <tbody>
	            <tr th:each="emp : ${employeeList}">
	                <td th:text="${emp.id}"></td>
	                <td th:text="${emp.code}"></td>
	                <td th:text="${emp.name}"></td>
	                <td th:text="${emp.age}"></td>
	                <td>
	                    <a th:href="@{/emp/delete/{id}(id=${emp.id})}" 
	                       onclick="return confirm('Are you sure you want to delete this employee?');">Delete</a>
	                </td>
	            </tr>
	        </tbody>
	    </table>
    </div>
    
    <div>
    	<a href="/emp/register">Add New Employee</a>
    </div>

</body>
</html>
