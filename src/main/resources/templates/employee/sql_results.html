<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SQL Assignment Results</title>
    <style>
        table { border-collapse: collapse; margin-bottom: 20px; width: 400px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .section { margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
    </style>
</head>
<body>

    <h1>練習問題 問1 Results</h1>

    <div class="section">
        <h2>問1-1: 基本的なSQL文 (全件検索)</h2>
        <table>
            <thead>
                <tr><th>ID</th><th>Code</th><th>Name</th><th>Age</th></tr>
            </thead>
            <tbody>
                <tr th:each="emp : ${allEmployees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.code}"></td>
                    <td th:text="${emp.name}"></td>
                    <td th:text="${emp.age}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="section">
        <h2>問1-2: SELECT文 (条件検索: 30歳以上)</h2>
        <table>
            <thead>
                <tr><th>ID</th><th>Code</th><th>Name</th><th>Age</th></tr>
            </thead>
            <tbody>
                <tr th:each="emp : ${seniorEmployees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.code}"></td>
                    <td th:text="${emp.name}"></td>
                    <td th:text="${emp.age}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="section">
        <h2>問1-3: SELECT文 (集計関数・平均年齢)</h2>
        <p>従業員の平均年齢: <strong><span th:text="${averageAge}"></span> 歳</strong></p>
    </div>

    <p><a href="/emp/find">← Back to Main Employee Dashboard</a></p>

</body>
</html>
