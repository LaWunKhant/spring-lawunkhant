<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>入力内容の確認</title>
</head>
<body>
    <h2>入力内容の確認</h2>
    <table border="1">
        <tr>
            <th>商品コード</th>
            <td th:text="${customForm.productCode}"></td>
        </tr>
        <tr>
            <th>商品名</th>
            <td th:text="${customForm.productName}"></td>
        </tr>
        <tr>
            <th>価格</th>
            <td th:text="${customForm.price} + ' 円'"></td>
        </tr>
    </table>
    <br>
    <a th:href="@{/manual/exercise/form}">入力画面に戻る</a>
</body>
</html>
