<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Football Player Management</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; max-width: 900px; margin-top: 15px; }
        th, td { border: 1px solid #CCC; padding: 10px; text-align: left; }
        th { background-color: #EFEFEF; }
        .alert { padding: 10px; background-color: #D4EDDA; color: #155724; border: 1px solid #C3E6CB; margin-bottom: 15px; max-width: 900px; }
        .search-box { background: #F8F9FA; padding: 15px; border: 1px solid #DDD; max-width: 900px; margin-bottom: 20px; }
        .btn { padding: 5px 10px; text-decoration: none; border-radius: 3px; display: inline-block; }
        .btn-edit { background: #FFC107; color: #000; }
        .btn-del { background: #DC3545; color: #FFF; }
        .btn-add { background: #007BFF; color: #FFF; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>選手管理システム (Football CRUD)</h1>

    <div class="alert" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert-error" th:if="${errorMessage}" th:text="${errorMessage}" style="padding: 10px; background-color: #F8D7DA; color: #721C24; border: 1px solid #F5C6CB; margin-bottom: 15px; max-width: 900px;"></div>

    <div class="search-box">
        <h3>選手検索フィルター</h3>
        <form th:action="@{/player/search}" method="get">
            名前: <input type="text" name="name">
            年齢下限: <input type="number" name="ageLower" style="width:60px;"> ~ 
            上限: <input type="number" name="ageUpper" style="width:60px;">
            <input type="submit" value="検索する">
            <a th:href="@{/player/all}">クリア</a>
        </form>
    </div>

    <a th:href="@{/player/register}" class="btn btn-add">+ 新規選手を登録する</a>

    <p><strong>全体の平均年齢:</strong> <span th:text="${#numbers.formatDecimal(averageAge, 1, 1)}">0.0</span> 歳</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>背番号/コード</th>
                <th>名前</th>
                <th>年齢</th>
                <th>アクション</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${players}">
                <td><a th:href="@{/player/findone/{id}(id=${p.id})}" th:text="${p.id}"></a></td>
                <td th:text="${p.code}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.age}"></td>
                <td>
                    <a th:href="@{/player/edit/{id}(id=${p.id})}" class="btn btn-edit">編集</a>
                    <a th:href="@{/player/delete/{id}(id=${p.id})}" class="btn btn-del" onclick="return confirm('本当に削除しますか？')">削除</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(players)}">
                <td colspan="5" style="text-align:center;">選手データが見つかりません。</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
