<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>選手情報の登録・編集</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        input[type="text"], input[type="number"] { padding: 6px; width: 250px; }
        .btn-submit { background: #28A745; color: white; padding: 8px 15px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1 th:text="${player.id == null} ? '新規選手登録' : '選手情報の編集'">選手情報</h1>

    <form th:action="@{/player/save}" th:object="${player}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label for="code">選手コード:</label>
            <input type="text" th:field="*{code}" placeholder="例: M10" required />
        </div>

        <div class="form-group">
            <label for="name">選手名:</label>
            <input type="text" th:field="*{name}" placeholder="例: Lionel Messi" required />
        </div>

        <div class="form-group">
            <label for="age">年齢:</label>
            <input type="number" th:field="*{age}" placeholder="例: 38" min="15" max="50" required />
        </div>
        
        <div th:if="${errorMessage}" style="color: white; background-color: #DC3545; padding: 10px; margin-bottom: 15px; border-radius: 4px; font-weight: bold;">
	        <span th:text="${errorMessage}"></span>
	    </div>

        <button type="submit" class="btn-submit">保存する</button>
        <a th:href="@{/player/all}" style="margin-left: 15px;">キャンセル</a>
    </form>

</body>
</html>
