<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタッフ登録</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #CCC;
            padding: 20px;
            border-radius: 5px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="radio"] {
            margin: 5px 0;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        input[type="submit"] {
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .back-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>スタッフ登録</h1>

        <form th:action="@{/enum/staff/register}" method="post" th:object="${staffForm}">
            <!-- 名前入力 -->
            <label for="name">名前</label>
            <input type="text" id="name" name="name" placeholder="スタッフ名" required>

            <!-- 性別ラジオボタン -->
            <label>性別を選択してください</label>
            <div class="radio-group">
                <span th:each="gen : ${staffGender}" th:object="${gen}" class="radio-item">
                    <!-- value属性にEnum定数をセット（MALE、FEMALEなど） -->
                    <input type="radio" name="gender" th:value="*{name}" th:id="|gender-*{name}|" required>
                    <!-- ラベルに日本語表示（getText()で取得） -->
                    <label th:text="*{text}" th:for="|gender-*{name}|"></label>
                </span>
            </div>

            <!-- 送信ボタン -->
            <input type="submit" value="登録">
        </form>

        <div class="back-link">
            <a th:href="@{/enum/staff/list}">← スタッフ一覧に戻る</a>
        </div>
    </div>
</body>
</html>
