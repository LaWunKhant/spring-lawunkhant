<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタッフ一覧</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #CCC;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .btn {
            padding: 5px 10px;
            margin: 5px;
            text-decoration: none;
            border-radius: 3px;
        }
        .btn-register {
            background-color: #4CAF50;
            color: white;
        }
        .btn-delete {
            background-color: #f44336;
            color: white;
        }
        .message {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 3px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>スタッフ一覧</h1>

        <!-- 成功メッセージ表示 -->
        <div th:if="${successMessage}" class="message success" th:text="${successMessage}"></div>

        <!-- 登録ボタン -->
        <a th:href="@{/enum/staff/register}" class="btn btn-register">新規登録</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>名前</th>
                    <th>性別</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${staffs.size() > 0}" th:each="staff : ${staffs}" th:object="${staff}">
                    <td th:text="*{id}"></td>
                    <td th:text="*{name}"></td>
                    <!-- Enum の getText() メソッドでプロパティアクセス -->
                    <td th:text="*{gender.text}"></td>
                    <td>
                        <a th:href="@{/enum/staff/delete/{id}(id=*{id})}" class="btn btn-delete">削除</a>
                    </td>
                </tr>
                <tr th:if="${staffs.size() == 0}">
                    <td colspan="4" style="text-align: center;">登録されているスタッフはいません。</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
