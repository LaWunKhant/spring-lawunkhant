<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>テキストファイル操作</title>
	<link rel="stylesheet" th:href="@{/css/manual.css}">
</head>
<body>
	<h1>テキストファイル操作</h1>
	<div th:if="${resultMessage}" class="messageBlock"><!-- 完了メッセージ -->
		<p th:text="${resultMessage}" class="messageBlock_text"></p>
	</div>
	<div class="block">
		<h2>テキストファイルのアップロード</h2>
		<form method="post" th:action="@{/textope/upload}" enctype="multipart/form-data">
			<input type="file" name="file" accept="text/plain">
			<input type="submit" value="アップロード">
		</form>
		<th:block th:if="${textOpeForm != null}" th:object="${textOpeForm}"><!-- エラー表示 -->
			<p th:if="${#fields.hasErrors('file')}" th:errors="*{file}" style="color:red"></p>
		</th:block>
	</div>
	<div class="block">
		<h2>保存したテキストファイルの表示</h2>
		<table>
			<tr>
				<th>タイトル</th>
				<th>テキストファイルの内容</th>
			</tr>
			<tr th:each="file : ${list}" th:object="${file}">
				<td th:text="*{name}"></td>
				<td th:utext="*{content}"></td>
			</tr>
		</table>
	</div>

	<!-- 従来の追記フォーム -->
	<div class="block">
		<h2>テキストファイルの書き込み（追記）</h2>
		<p>sample.txt に追記します。</p>
		<form method="post" th:action="@{/textope/append}">
			<textarea cols="45" rows="4" name="textPlus"></textarea>
			<input type="submit" value="送信">
		</form>
	</div>

	<!-- 練習問題 問1：選択したファイルへの追記 -->
	<div class="block">
		<h2>テキストファイルの書き込み（選択ファイルへの追記）</h2>
		<p>セレクトボックスから追記対象のファイルを選択してください。</p>
		<form method="post" th:action="@{/textope/append-selected}" th:object="${textOpeForm}">
			<div>
				<label for="selectedFileName">ファイル選択:</label>
				<select th:field="*{selectedFileName}" id="selectedFileName" required>
					<option value="">-- ファイルを選択してください --</option>
					<option th:each="fileName : ${fileNames}" th:value="${fileName}" th:text="${fileName}"></option>
				</select>
			</div>
			<div style="margin-top: 10px;">
				<label for="textPlus">追記内容:</label><br>
				<textarea th:field="*{textPlus}" id="textPlus" cols="45" rows="4" required></textarea>
			</div>
			<input type="submit" value="追記する">
		</form>
		<th:block th:if="${textOpeForm != null}" th:object="${textOpeForm}">
			<p th:if="${#fields.hasErrors('selectedFileName')}" th:errors="*{selectedFileName}" style="color:red"></p>
			<p th:if="${#fields.hasErrors('textPlus')}" th:errors="*{textPlus}" style="color:red"></p>
		</th:block>
	</div>
</body>
</html>
