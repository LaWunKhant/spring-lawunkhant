<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>チーム詳細プロフィール</title>
    <style>
        body { font-family: sans-serif; margin: 30px; line-height: 1.6; }
        .card { border: 1px solid #DDD; padding: 20px; max-width: 500px; background: #FAFAFA; }
        h2 { margin-top: 0; color: #333; }
        .btn-back { background: #6C757D; color: #FFF; padding: 8px 12px; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>

    <h1>チーム詳細情報</h1>

    <div class="card" th:if="${team != null}">
        <h2 th:text="${team.teamName}">チーム名</h2>
        <p><strong>管理ID:</strong> <span th:text="${team.id}"></span></p>
        <p><strong>リーグ:</strong> <span th:text="${team.league}"></span></p>
    </div>

    <div th:if="${team == null}">
        <p>該当するチームは見つかりませんでした。</p>
    </div>

    <br>
    <a th:href="@{/team/all}" class="btn-back">← チーム一覧に戻る</a>

</body>
</html>
