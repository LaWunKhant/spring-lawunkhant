<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>チーム管理</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; max-width: 900px; margin-top: 15px; }
        th, td { border: 1px solid #CCC; padding: 10px; text-align: left; }
        th { background-color: #EFEFEF; }
        .alert { padding: 10px; background-color: #D4EDDA; color: #155724; border: 1px solid #C3E6CB; margin-bottom: 15px; max-width: 900px; }
        .btn { padding: 5px 10px; text-decoration: none; border-radius: 3px; display: inline-block; }
        .btn-edit { background: #FFC107; color: #000; }
        .btn-del { background: #DC3545; color: #FFF; }
        .btn-add { background: #007BFF; color: #FFF; margin-bottom: 15px; }
        .btn-back { background: #6C757D; color: #FFF; }
    </style>
</head>
<body>

    <h1>チーム管理システム (Team CRUD)</h1>

    <div class="alert" th:if="${successMessage}" th:text="${successMessage}"></div>

    <a th:href="@{/team/register}" class="btn btn-add">+ 新規チームを登録する</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>チーム名</th>
                <th>リーグ</th>
                <th>アクション</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${teams}">
                <td><a th:href="@{/team/findone/{id}(id=${t.id})}" th:text="${t.id}"></a></td>
                <td th:text="${t.teamName}"></td>
                <td th:text="${t.league}"></td>
                <td>
                    <a th:href="@{/team/edit/{id}(id=${t.id})}" class="btn btn-edit">編集</a>
                    <a th:href="@{/team/delete/{id}(id=${t.id})}" class="btn btn-del" onclick="return confirm('本当に削除しますか？')">削除</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(teams)}">
                <td colspan="4" style="text-align:center;">チームデータが見つかりません。</td>
            </tr>
        </tbody>
    </table>

    <br>
    <a th:href="@{/player/all}" class="btn btn-back">← 選手一覧に戻る</a>

</body>
</html>
