<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>選手チーム割り当ての登録・編集</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 140px; font-weight: bold; }
        input[type="text"], input[type="number"], select { padding: 6px; width: 250px; }
        .btn-submit { background: #28A745; color: white; padding: 8px 15px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 th:text="${assignment.id == null} ? '新規割り当て登録' : '割り当て編集'">新規割り当て登録</h2>
        
        <form th:action="@{/playerteam/save}" th:object="${assignment}" method="post">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{player.id}" />

            <div class="form-group">
                <label>チームを選択:</label>
                <select th:field="*{team.id}" th:disabled="${assignment.id != null}" required>
                    <option value="">-- チームを選択してください --</option>
                    <option th:each="t : ${allTeams}" th:value="${t.id}" th:text="${t.teamName} + ' (' + ${t.league} + ')'"></option>
                </select>
                
                <input type="hidden" th:if="${assignment.id != null}" th:name="team.id" th:value="${assignment.team.id}" />
            </div>

            <div class="form-group">
                <label>契約年:</label>
                <input type="number" th:field="*{contractYear}" placeholder="例: 2023" required />
            </div>

            <button type="submit" class="btn-submit">保存する</button>
            <a th:href="@{/player/findone/{id}(id=${assignment.player.id})}" style="margin-left: 10px; color: #6c757d;">キャンセル</a>
        </form>
    </div>

</body>
</html>
