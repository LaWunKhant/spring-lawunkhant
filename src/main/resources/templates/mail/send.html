<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8" />
    <title>メール送信</title>
    <style>
        h1 { font-size: 20px; text-decoration: underline; }
        p { font-size: 16px; }
    </style>
</head>
<body>
    <div>
        <h1 th:text="${name} + ' 様'"></h1>
        <p th:text="'メールアドレス：' + ${email}"></p>
        <p>ご記載いただいたアンケート内容をお送りいたします。</p>
        <p>---------------<br>
            <span th:utext="${content}"></span><br>
            ---------------
        </p>
        <p>ご回答ありがとうございました。</p>
    </div>
</body>
</html>
