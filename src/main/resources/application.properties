spring.application.name=spring-lawunkhant

# Validation message file settings
spring.messages.basename=ValidationMessages
spring.messages.encoding=UTF-8

# MySQL Database Connection Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# We connect to localhost on port 3306, pointing to the database instance named 'my_mysql'
spring.datasource.url=jdbc:mysql://localhost:3306/my_mysql?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root1234

# Hibernate/JPA settings to log SQL statements in console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

